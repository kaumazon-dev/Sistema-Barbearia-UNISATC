server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A API fica na mesma origem do front: sem CORS no ambiente do compose.
    # "backend" e o nome do servico na rede do Docker Compose.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos do build tem hash no nome: podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca em cache, para um deploy novo aparecer na hora.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
