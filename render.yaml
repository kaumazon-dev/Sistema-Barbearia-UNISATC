# Blueprint do Render: cria o Postgres e a API de uma vez.
# No painel: New > Blueprint > escolher este repositorio (branch main).
#
# O schema nao e criado a mao: o entrypoint.sh roda "flask db upgrade" a cada
# deploy, entao as mesmas migrations do Git montam o banco de producao.

databases:
  - name: barbearia-db
    plan: free
    region: oregon
    databaseName: barbearia
    user: barbearia
    # Rede interna do Render apenas; para rodar o seed.py da sua maquina,
    # use a "External Database URL" do painel (o acesso externo continua
    # liberado, protegido pela senha).

services:
  - type: web
    name: barbearia-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # /health responde 503 se o banco cair: o Render so troca a versao no
    # ar quando a nova responde 200.
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: barbearia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRA_MINUTOS
        value: "720"
      # Popula o banco com o seed.py no primeiro deploy (idempotente).
      - key: RODAR_SEED
        value: "1"
      # URL do front no Vercel, sem barra no final (ex.: https://nextbarber.vercel.app).
      # O ProdConfig recusa subir sem ela e recusa "*".
      - key: CORS_ORIGINS
        sync: false
      # Esqueci minha senha: SMTP que envia o link. Sem MAIL_SERVIDOR o link so
      # aparece no log da API. O link aponta para a 1a origem do CORS_ORIGINS.
      - key: MAIL_SERVIDOR
        sync: false
      - key: MAIL_PORTA
        value: "587"
      - key: MAIL_USUARIO
        sync: false
      - key: MAIL_SENHA
        sync: false
      - key: MAIL_REMETENTE
        sync: false
      # Limite de tentativas: navegador -> Vercel (rewrite) -> proxy do Render
      # -> API. Sao 2 proxies nossos; o ProxyFix pega o IP real do cliente no
      # X-Forwarded-For. Se um dia o front chamar o Render direto, mude para 1.
      - key: PROXIES_CONFIAVEIS
        value: "2"
